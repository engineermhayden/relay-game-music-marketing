services:
  app:
    build:
      target: dependencies
    command: npm run dev
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next-cache:/app/.next
volumes:
  dev-node-modules:
  dev-next-cache:
