name: galileo-observatory
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: galileo
      POSTGRES_USER: galileo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galileo_local_dev}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galileo -d galileo"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: postgres://galileo:${POSTGRES_PASSWORD:-galileo_local_dev}@db:5432/galileo
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://galileo:${POSTGRES_PASSWORD:-galileo_local_dev}@db:5432/galileo
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  postgis-data:
