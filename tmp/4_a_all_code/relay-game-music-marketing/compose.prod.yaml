# Production stack: every setting must come from .env (copy of .env.prod); no fallbacks.
# docker compose -f compose.prod.yaml up -d --build
name: aura-relay
x-backend-env: &backend-env
  DB_HOST: db
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_URL: redis://redis:6379/0
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
  DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:?}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: ["./postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy noeviction
    volumes: ["./redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      <<: *backend-env
      COOKIE_SECURE: ${COOKIE_SECURE:?}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:?}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:?}
      # Optional player accounts: links in emails and SMTP delivery.
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?}
      EMAIL_HOST: ${EMAIL_HOST:?}
      EMAIL_PORT: ${EMAIL_PORT:?}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:?}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:?}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
      # Player feedback: staff notified of new submissions, and abuse limits.
      STAFF_EMAILS: ${STAFF_EMAILS:?}
      FEEDBACK_SUBMISSIONS_PER_IP_HOUR: ${FEEDBACK_SUBMISSIONS_PER_IP_HOUR:?}
      FEEDBACK_SUBMISSIONS_PER_SUBMITTER_DAY: ${FEEDBACK_SUBMISSIONS_PER_SUBMITTER_DAY:?}
      FEEDBACK_VOTES_PER_IP_HOUR: ${FEEDBACK_VOTES_PER_IP_HOUR:?}
      FEEDBACK_VOTER_CHECK_HOURS: ${FEEDBACK_VOTER_CHECK_HOURS:?}
      FEEDBACK_SUBMISSION_COOLDOWN_SECONDS: ${FEEDBACK_SUBMISSION_COOLDOWN_SECONDS:?}
      FEEDBACK_VOTES_PER_IDEA_PER_IP_DAY: ${FEEDBACK_VOTES_PER_IDEA_PER_IP_DAY:?}
      FEEDBACK_MAX_LINKS: ${FEEDBACK_MAX_LINKS:?}
      # May be empty: no blocked words.
      FEEDBACK_BLOCKED_WORDS: ${FEEDBACK_BLOCKED_WORDS:-}
    volumes: ["music_media:/app/media", "backend_static:/app/staticfiles"]
    command: sh -c "python manage.py migrate --noinput && python manage.py import_songs && python manage.py collectstatic --noinput && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  simulation:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend-env
    command: python manage.py run_simulation
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  nginx:
    build: { context: ., dockerfile: deploy/nginx/Dockerfile }
    environment:
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:?}
    volumes: ["music_media:/srv/media:ro", "backend_static:/srv/static:ro"]
    ports: ["${HTTP_PORT:?}:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  music_media:
  backend_static:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:?}
