map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $forwarded_scheme { default $scheme; https https; http http; }
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400";
    }
    location /static/ { alias /srv/static/; }
    location = /${DJANGO_ADMIN_PATH} { absolute_redirect off; return 301 /${DJANGO_ADMIN_PATH}/; }
    location ~ ^/(${DJANGO_ADMIN_PATH}|api-auth|api/music)/ {
        client_max_body_size 110m;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 120s;
    }
    # Feedback posts may carry an opt-in screenshot (the API accepts up to 1.5 MB, sent base64-encoded
    # in JSON, which Django's default 2.5 MB request limit also covers). Every other API route keeps 16k.
    location = /api/feedback/ {
        client_max_body_size 3m;
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 40s;
    }
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $api_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 40s;
    }
    location /ws/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
